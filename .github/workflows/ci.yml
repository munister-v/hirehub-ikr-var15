name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check .

  test-django:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: django_app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-report=term --cov-fail-under=70

  test-fastapi:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: fastapi_service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term --cov-fail-under=70

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test-django, test-fastapi]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
