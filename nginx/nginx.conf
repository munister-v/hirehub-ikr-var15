# Reverse proxy: єдина точка входу http://localhost:8080
#   /            → Django (сайт, /admin, /api, /api/docs)
#   /matching/   → FastAPI (Swagger: /matching/docs, ReDoc: /matching/redoc, WebSocket: /matching/ws/...)
#   /media/      → завантажені резюме (спільний том із Django)
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # обмеження частоти запитів до отримання токена (додатково до throttling у DRF)
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

    upstream django   { server django:8000; }
    upstream matching { server fastapi:8000; }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        client_max_body_size 6m;      # резюме до 5 МБ + службові поля

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location /matching/ {
            rewrite ^/matching/(.*)$ /$1 break;
            proxy_pass http://matching;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;          # WebSocket
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location /media/ {
            alias /app/media/;
            add_header Content-Disposition attachment;       # резюме завантажуються, а не виконуються у браузері
            expires 1h;
        }

        location = /api/auth/token/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
