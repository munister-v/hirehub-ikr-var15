# Увесь комплекс однією командою:  docker compose up --build
# Вхід:  http://localhost:8080  (сайт) · /api/docs/ (Swagger DRF) · /matching/docs (Swagger FastAPI)
# Перед запуском: cp .env.example .env  і змініть секрети.

# ім'я проєкту задано явно (тека репозиторію може мати нелатинську назву)
name: hirehub

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${DJANGO_DB}
  REDIS_URL: redis://redis:6379/0
  SHARED_JWT_SECRET: ${SHARED_JWT_SECRET}
  MATCHING_SERVICE_URL: http://fastapi:8000
  MATCHING_PUBLIC_WS_URL: ws://localhost:8080/matching
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_DB: ${DJANGO_DB}
      FASTAPI_DB: ${FASTAPI_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  django:
    build: ./django_app
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      fastapi: {condition: service_healthy}   # початкова індексація потребує готового Matching Service
    volumes:
      - media:/app/media

  celery_worker:
    build: ./django_app
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      <<: *django-env
      RUN_SETUP: "false"
    healthcheck:       # образний HEALTHCHECK перевіряє HTTP — для воркера це не підходить
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      django: {condition: service_healthy}
    volumes:
      - media:/app/media

  celery_beat:
    build: ./django_app
    restart: unless-stopped
    # розклад пишемо в /tmp: каталог /app належить root, контейнер працює від користувача app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      <<: *django-env
      RUN_SETUP: "false"
    healthcheck:
      disable: true
    depends_on:
      django: {condition: service_healthy}

  fastapi:
    build: ./fastapi_service
    restart: unless-stopped
    environment:
      MATCHING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${FASTAPI_DB}
      SHARED_JWT_SECRET: ${SHARED_JWT_SECRET}
      MATCHING_ADMIN_USERNAME: ${MATCHING_ADMIN_USERNAME:-admin}
      MATCHING_ADMIN_PASSWORD: ${MATCHING_ADMIN_PASSWORD}
      MATCHING_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      MATCHING_ROOT_PATH: /matching
    depends_on:
      db: {condition: service_healthy}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/app/media:ro
    depends_on:
      django: {condition: service_healthy}
      fastapi: {condition: service_healthy}

volumes:
  pgdata:
  media:
